# ================================================
# NLI4CT augmentation experiment, prompt v2 (task version 2.0): untrained Qwen3-8B, 0-shot
# ================================================
# Usage: ./run_single_turn.sh --config run_tasks-scripts/examples/Augmentation/8B_NLI4CT_AugExp_p2.conf
# Slurm: cd _SLURM_Run && ./slurm_submit.sh 8B_NLI4CT_AugExp_p2 pcie
# Tables afterwards:
#   python scripts/augmentation_breakdown.py --input_folders "$OUTPUT_BASE" --output_dir "${OUTPUT_BASE}_Tables"
#
# SemEval_NLI4CT_AugExp: the 20% test part of araag2/SemEval_NLI4CT_Augmented (2024_augmented), originals and
# their variants. SemEval_NLI4CT_2024: the official 2024 test split, which no trained model has seen.
# Fine-tuned models are evaluated by their training job (_SLURM_Run/training/nli4ct_train_eval.sbatch).

MODELS=(
    "pretrained=Qwen/Qwen3-8B"
)

TASKS=(
    "SemEval_NLI4CT_AugExp"
    "SemEval_NLI4CT_2024"
)

MODES=("0-shot")

OUTPUT_BASE="/user/home/aguimas/data/PhD/Active_Dev/lm-evaluation-harness/outputs/NLI4CT_AugExp_p2"
CUDA_DEVICES="0"
BATCH_SIZE="auto"
TASKS_PER_RUN=1
SEED="0"
USE_TIMESTAMP=true
# Runtime profile
PROFILE="BALANCED_MEM"
