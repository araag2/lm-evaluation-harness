name: OpenCTEval compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install CPU test dependencies
        run: uv pip install -e . 'pytest>=8' 'datasets>=2.16,<4'
      - name: Run offline compatibility contracts
        env:
          HF_HUB_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_opencteval_compat.py
          tests/test_intervention_metrics.py
          tests/test_metrics.py
          tests/test_aggregation_pipeline.py
          tests/test_registry.py
          tests/test_evaluator_utils.py
